services:
  postgres:
    image: postgres:15-alpine
    container_name: agro_scale_postgres
    restart: always
    environment:
      POSTGRES_USER: agro_user
      POSTGRES_PASSWORD: agro_password
      POSTGRES_DB: agro_scale_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agro_user -d agro_scale_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agro_scale_backend
    restart: always
    ports:
      - "3002:3002"
    env_file:
      - ./backend/.env
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://agro_user:agro_password@postgres:5432/agro_scale_db?schema=public
      ML_SERVICE_URL: http://host.docker.internal:5000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
