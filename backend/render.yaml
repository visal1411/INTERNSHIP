services:
  - type: web
    name: agroscale-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma db push && node src/server.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: IOT_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
